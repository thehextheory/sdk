name: Publish packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Publish packages that are not on npm yet
        run: |
          publish() {
            name="$1"
            version="$(npm pkg get version -w "$name" | tr -d '"')"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
            else
              npm publish -w "$name"
            fi
          }
          publish @thehextheory/core
          publish @thehextheory/cli
