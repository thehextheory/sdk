name: Publish packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Publish packages that are not on npm yet
        run: |
          publish() {
            name="$1"
            manifest="$2"
            version=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$manifest")
            encoded=$(node -p 'encodeURIComponent(process.argv[1])' "$name")
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${encoded}/${version}")
            if [ "$status" = "200" ]; then
              echo "$name@$version is already on npm"
            else
              echo "$name@$version is not on npm (HTTP $status), publishing"
              npm publish -w "$name"
            fi
          }
          publish @thehextheory/core packages/core/package.json
          publish @thehextheory/cli packages/cli/package.json
